<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voicin</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --sep: rgba(60,60,67,.12);
    --fg: #1c1c1e; --muted: #8a8a8e;
    --blue: #007aff; --green: #34c759; --red: #ff3b30; --orange: #ff9f0a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000; --card: #1c1c1e; --sep: rgba(84,84,88,.6);
      --fg: #f2f2f7; --muted: #8e8e93;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none; overflow: hidden; }
  body { display: flex; flex-direction: column; padding: 12px; gap: 10px; position: relative; }
  .card { background: var(--card); border-radius: 18px; }
  button { font: inherit; cursor: pointer; border: 0; }

  header { display: flex; align-items: center; gap: 10px; }
  .app-icon { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(145deg, #5ac8fa, #007aff 55%, #5856d6); box-shadow: 0 2px 6px rgba(0,122,255,.35); }
  .app-icon svg { width: 17px; height: 17px; fill: #fff; }
  .title { font-size: 15px; font-weight: 700; flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
    color: var(--muted); background: rgba(142,142,147,.16); padding: 4px 9px; border-radius: 999px; transition: all .25s; }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  body.on .pill { color: #1a8f3c; background: rgba(52,199,89,.18); }
  body.on .pill i { background: var(--green); box-shadow: 0 0 6px var(--green); }

  .wave-card { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 10px 12px; }
  canvas { width: 100%; height: 74px; display: block; }
  .hint { margin-top: 4px; font-size: 12px; color: var(--muted); }
  body.on .hint { display: none; }
  .transcript { margin-top: 6px; width: 100%; text-align: center; font-size: 13px; line-height: 1.35;
    opacity: 0; transform: translateY(3px); transition: opacity .3s, transform .3s;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 18px; }
  .transcript.show { opacity: 1; transform: none; }

  .settings { position: relative; }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; width: 100%;
    background: none; color: var(--fg); font-size: 13px; text-align: left; }
  .badge { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
    background: linear-gradient(145deg, #ff9f0a, #ff375f); flex: none; }
  .badge svg { width: 14px; height: 14px; fill: #fff; }
  .row .label { flex: 1; }
  .row .value { color: var(--blue); font-weight: 500; }
  .row .chev { width: 10px; height: 10px; fill: var(--muted); transition: transform .2s; }
  body.menu-open .row .chev { transform: rotate(180deg); }
  .menu { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); background: var(--card);
    border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.18); max-height: calc(3 * 34px + 8px); overflow-y: auto;
    padding: 4px; display: none; z-index: 5; }
  body.menu-open .menu { display: block; }
  .opt { display: flex; align-items: center; height: 34px; padding: 0 10px; border-radius: 9px; font-size: 13px; cursor: pointer; }
  .opt:hover { background: rgba(0,122,255,.1); }
  .opt .tick { margin-left: auto; width: 14px; height: 14px; visibility: hidden; }
  .opt.sel { color: var(--blue); font-weight: 600; }
  .opt.sel .tick { visibility: visible; }
  .menu::-webkit-scrollbar { width: 4px; }
  .menu::-webkit-scrollbar-thumb { background: rgba(127,127,127,.4); border-radius: 4px; }

  .trial { font-size: 11px; color: var(--muted); text-align: center; }
  .trial b { color: var(--orange); font-weight: 600; }

  /* License lock / purchase screen */
  .sheet { position: absolute; inset: 0; background: var(--bg); padding: 12px; display: none; flex-direction: column;
    gap: 10px; overflow-y: auto; z-index: 10; }
  body.locked .sheet { display: flex; }
  .sheet h2 { margin: 2px 0 0; font-size: 17px; text-align: center; }
  .sheet .sub { font-size: 12px; color: var(--muted); text-align: center; }
  .price { font-size: 28px; font-weight: 700; text-align: center; letter-spacing: -.5px; }
  .price small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .seg { display: flex; background: rgba(127,127,127,.16); border-radius: 9px; padding: 2px; }
  .seg button { flex: 1; height: 26px; border-radius: 7px; background: transparent; color: var(--fg); font-size: 12px; font-weight: 600; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .wallet { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: var(--card); border-radius: 12px; font-size: 11px;
    font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
  .wallet span { flex: 1; }
  .copy { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 11px; color: var(--blue); font-weight: 600; background: none; padding: 2px 4px; }
  input { width: 100%; height: 34px; border-radius: 10px; border: 1px solid var(--sep); background: var(--card); color: var(--fg);
    padding: 0 10px; font: inherit; font-size: 12px; outline: none; user-select: text; }
  input:focus { border-color: var(--blue); }
  .btn { width: 100%; height: 36px; border-radius: 11px; background: var(--blue); color: #fff; font-size: 13px; font-weight: 600; }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: rgba(0,122,255,.12); color: var(--blue); }
  .msg { font-size: 11px; min-height: 14px; text-align: center; color: var(--muted); }
  .msg.err { color: var(--red); }
  .msg.ok { color: var(--green); }
  .divider { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--sep); }
</style>
</head>
<body id="body">
  <header>
    <div class="app-icon">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
    </div>
    <span class="title">Voicin</span>
    <span class="pill"><i></i><span id="state">Off</span></span>
  </header>

  <section class="card wave-card">
    <canvas id="wave" width="600" height="160"></canvas>
    <div class="hint" id="hint">Press and release Ctrl to start</div>
    <div class="transcript" id="transcript"></div>
  </section>

  <section class="card settings">
    <div class="menu" id="menu"></div>
    <button class="row" id="toggle" type="button">
      <span class="badge">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 6h-2.9a15.6 15.6 0 0 0-1.3-3.6A8 8 0 0 1 18.9 8ZM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4ZM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3Zm.8 2h2.9c.3 1.3.8 2.5 1.3 3.6A8 8 0 0 1 5.1 16ZM8 8H5.1a8 8 0 0 1 4.2-3.6C8.8 5.5 8.3 6.7 8 8Zm4 12c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4Zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4Zm.3 5.6c.5-1.1 1-2.3 1.3-3.6h2.9a8 8 0 0 1-4.2 3.6Zm1.7-5.6a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4h-3.4Z"/></svg>
      </span>
      <span class="label">Language</span>
      <span class="value" id="value">Vietnamese</span>
      <svg class="chev" viewBox="0 0 10 10"><path d="M1 3l4 4 4-4"/></svg>
    </button>
  </section>

  <div class="trial" id="trial"></div>

  <!-- Lock screen: shown when the trial ends or the user presses Unlock -->
  <section class="sheet" id="sheet">
    <h2>Unlock Voicin</h2>
    <div class="sub" id="trialEnded">Your 4-hour free trial has ended.</div>
    <div class="price">$10 <small>USDT · lifetime</small></div>

    <div class="seg" id="net">
      <button type="button" class="on" data-net="bsc">BSC (BEP-20)</button>
      <button type="button" data-net="eth">Ethereum (ERC-20)</button>
    </div>
    <div class="wallet"><span id="wallet">Loading…</span><button class="copy" id="copy" type="button">Copy</button></div>
    <input id="tx" placeholder="Paste the transaction hash (0x…)" spellcheck="false">
    <button class="btn" id="claim" type="button">Verify payment &amp; get key</button>

    <div class="divider">or</div>

    <input id="key" placeholder="License key (VOIC-XXXX-XXXX-XXXX-XXXX)" spellcheck="false">
    <button class="btn ghost" id="activate" type="button">Activate</button>
    <div class="msg" id="msg"></div>
  </section>

<script>
(function () {
  var body = document.getElementById("body");
  var stateEl = document.getElementById("state");
  var canvas = document.getElementById("wave");
  var ctx = canvas.getContext("2d");
  var hint = document.getElementById("hint");
  var transcript = document.getElementById("transcript");
  var toggle = document.getElementById("toggle");
  var menu = document.getElementById("menu");
  var valueEl = document.getElementById("value");
  var trialEl = document.getElementById("trial");
  var sheet = document.getElementById("sheet");
  var msg = document.getElementById("msg");
  var walletEl = document.getElementById("wallet");
  var netBtns = document.querySelectorAll("#net button");
  var network = "bsc";
  var infoLoaded = false;

  var LANGS = [
    ["vi-VN", "Vietnamese"], ["auto", "Auto-detect"], ["en-US", "English"],
    ["zh-CN", "中文"], ["ja-JP", "日本語"], ["ko-KR", "한국어"], ["fr-FR", "Français"],
    ["de-DE", "Deutsch"], ["es-ES", "Español"], ["ru-RU", "Русский"]
  ];
  var TICK = '<svg class="tick" viewBox="0 0 14 14"><path d="M2 7.5l3.2 3L12 3.5" stroke="#007aff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function invoke(cmd, args) {
    var core = window.__TAURI__ && window.__TAURI__.core;
    return core ? core.invoke(cmd, args || {}) : Promise.reject("no backend");
  }

  // Language list: shows 3 items; scroll for more
  LANGS.forEach(function (l) {
    var d = document.createElement("div");
    d.className = "opt";
    d.dataset.code = l[0];
    d.innerHTML = "<span>" + l[1] + "</span>" + TICK;
    d.addEventListener("click", function (e) { e.stopPropagation(); choose(l[0], l[1]); });
    menu.appendChild(d);
  });

  function choose(code, name) {
    valueEl.textContent = name;
    Array.prototype.forEach.call(menu.children, function (c) { c.classList.toggle("sel", c.dataset.code === code); });
    body.classList.remove("menu-open");
    invoke("set_language", { code: code });
  }
  choose("vi-VN", "Vietnamese");

  toggle.addEventListener("click", function (e) { e.stopPropagation(); body.classList.toggle("menu-open"); });
  document.addEventListener("click", function () { body.classList.remove("menu-open"); });

  function setListening(on) {
    body.classList.toggle("on", on);
    stateEl.textContent = on ? "Listening" : "Off";
    hint.textContent = "Press and release Ctrl to start";
  }

  function showText(t) {
    transcript.textContent = t;
    transcript.classList.add("show");
    clearTimeout(showText.timer);
    showText.timer = setTimeout(function () { transcript.classList.remove("show"); }, 6000);
  }

  function fmt(secs) {
    var h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
    return h + "h " + (m < 10 ? "0" : "") + m + "m " + (s < 10 ? "0" : "") + s + "s";
  }

  function showLock(show) {
    body.classList.toggle("locked", show);
    if (show) loadInfo();
  }

  function renderLicense(st) {
    if (st.state === "licensed") {
      trialEl.innerHTML = "Licensed · lifetime";
      showLock(false);
    } else if (st.state === "trial") {
      trialEl.innerHTML = "Free trial · <b>" + fmt(st.remaining_secs) + "</b> left";
      showLock(false);
    } else {
      trialEl.innerHTML = "Trial ended";
      showLock(true);
    }
  }

  function loadInfo() {
    if (infoLoaded) return;
    invoke("license_info").then(function (info) {
      walletEl.textContent = info.wallet;
      infoLoaded = true;
    }).catch(function () {
      walletEl.textContent = "License server unreachable";
    });
  }

  function say(text, cls) { msg.textContent = text; msg.className = "msg " + (cls || ""); }

  function busy(btn, on) { btn.disabled = on; }

  netBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      network = b.dataset.net;
      netBtns.forEach(function (x) { x.classList.toggle("on", x === b); });
    });
  });

  document.getElementById("copy").addEventListener("click", function () {
    if (navigator.clipboard) navigator.clipboard.writeText(walletEl.textContent);
    say("Wallet copied", "ok");
  });

  document.getElementById("claim").addEventListener("click", function () {
    var tx = document.getElementById("tx").value.trim();
    if (!/^0x[0-9a-fA-F]{64}$/.test(tx)) { say("Enter a valid transaction hash", "err"); return; }
    var btn = this; busy(btn, true); say("Checking the blockchain…");
    invoke("license_claim", { network: network, txHash: tx }).then(function () {
      say("License activated. Thank you!", "ok");
    }).catch(function (e) { say(String(e), "err"); })
      .finally(function () { busy(btn, false); });
  });

  document.getElementById("activate").addEventListener("click", function () {
    var key = document.getElementById("key").value.trim();
    if (!key) { say("Enter your license key", "err"); return; }
    var btn = this; busy(btn, true); say("Activating…");
    invoke("license_activate", { key: key }).then(function () {
      say("License activated. Thank you!", "ok");
    }).catch(function (e) { say(String(e), "err"); })
      .finally(function () { busy(btn, false); });
  });

  // Audio waveform: rounded bars, blue-to-pink gradient
  var BARS = 24, levels = new Array(BARS).fill(0), current = 0, lastPush = 0, listening = false;
  function draw(t) {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (t - lastPush > 60) { levels.push(current); levels.shift(); lastPush = t; }
    var gap = 4, barW = (w - gap * (BARS - 1)) / BARS;
    var grad = ctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, "#5ac8fa"); grad.addColorStop(0.5, "#007aff"); grad.addColorStop(1, "#ff2d55");
    ctx.fillStyle = grad;
    for (var i = 0; i < BARS; i++) {
      var breathe = (Math.sin(t / 450 + i * 0.55) + 1) * 0.5 * (listening ? 0.08 : 0.05);
      var bh = Math.max(4, Math.max(levels[i], breathe) * h * 0.95);
      roundRect(i * (barW + gap), (h - bh) / 2, barW, bh, barW / 2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, h / 2, w / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  var ev = window.__TAURI__ && window.__TAURI__.event;
  if (ev) {
    ev.listen("listening", function (e) { listening = !!e.payload; setListening(listening); });
    ev.listen("level", function (e) { current = Number(e.payload) || 0; });
    ev.listen("text", function (e) { showText(String(e.payload)); });
    ev.listen("license", function (e) { renderLicense(e.payload); });
    ev.listen("locked", function () { renderLicense({ state: "trial_expired" }); });
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
