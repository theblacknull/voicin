<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voicin</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --sep: rgba(60,60,67,.12);
    --fg: #1c1c1e; --muted: #8a8a8e;
    --blue: #007aff; --indigo: #5856d6; --pink: #ff2d55; --green: #34c759; --red: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000; --card: #1c1c1e; --sep: rgba(84,84,88,.6);
      --fg: #f2f2f7; --muted: #8e8e93;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none; overflow: hidden; }
  body { display: flex; flex-direction: column; padding: 12px; gap: 10px; }

  /* Đầu: biểu tượng app + tên + trạng thái */
  header { display: flex; align-items: center; gap: 10px; }
  .app-icon { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(145deg, #5ac8fa, #007aff 55%, #5856d6); box-shadow: 0 2px 6px rgba(0,122,255,.35); }
  .app-icon svg { width: 17px; height: 17px; fill: #fff; }
  .title { font-size: 15px; font-weight: 700; flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
    color: var(--muted); background: rgba(142,142,147,.16); padding: 4px 9px; border-radius: 999px; transition: all .25s; }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background .25s, box-shadow .25s; }
  body.on .pill { color: #1a8f3c; background: rgba(52,199,89,.18); }
  body.on .pill i { background: var(--green); box-shadow: 0 0 6px var(--green); }

  /* Thẻ sóng âm thanh: chủ đạo, ở giữa */
  .card { background: var(--card); border-radius: 18px; }
  .wave-card { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 10px 12px; position: relative; }
  canvas { width: 100%; height: 74px; display: block; }
  .transcript { margin-top: 6px; width: 100%; text-align: center; font-size: 13px; line-height: 1.35;
    color: var(--fg); opacity: 0; transform: translateY(3px); transition: opacity .3s, transform .3s;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 18px; }
  .transcript.show { opacity: 1; transform: none; }
  .hint { margin-top: 4px; font-size: 12px; color: var(--muted); }
  body.on .hint { display: none; }

  /* Hàng ngôn ngữ (kiểu iOS) */
  .settings { position: relative; }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; width: 100%;
    background: none; border: 0; color: var(--fg); font: inherit; font-size: 13px; text-align: left; }
  .badge { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
    background: linear-gradient(145deg, #ff9f0a, #ff375f); flex: none; }
  .badge svg { width: 14px; height: 14px; fill: #fff; }
  .row .label { flex: 1; }
  .row .value { color: var(--blue); font-weight: 500; }
  .row .chev { width: 10px; height: 10px; fill: var(--muted); transition: transform .2s; }
  body.open .row .chev { transform: rotate(180deg); }

  /* Danh sách ngôn ngữ: hiện 3 mục, cuộn để xem thêm, mở lên trên */
  .menu { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); background: var(--card);
    border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.18); max-height: 3 * 34px + 8px; overflow-y: auto;
    padding: 4px; display: none; z-index: 5; }
  body.open .menu { display: block; }
  .opt { display: flex; align-items: center; height: 34px; padding: 0 10px; border-radius: 9px; font-size: 13px;
    cursor: pointer; }
  .opt:hover { background: rgba(0,122,255,.1); }
  .opt .tick { margin-left: auto; width: 14px; height: 14px; fill: var(--blue); visibility: hidden; }
  .opt.sel { color: var(--blue); font-weight: 600; }
  .opt.sel .tick { visibility: visible; }
  .menu::-webkit-scrollbar { width: 4px; }
  .menu::-webkit-scrollbar-thumb { background: rgba(127,127,127,.4); border-radius: 4px; }
</style>
</head>
<body id="body">
  <header>
    <div class="app-icon">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
    </div>
    <span class="title">Voicin</span>
    <span class="pill"><i></i><span id="state">Đã tắt</span></span>
  </header>

  <section class="card wave-card">
    <canvas id="wave" width="600" height="160"></canvas>
    <div class="hint" id="hint">Nhấn Ctrl để bắt đầu nói</div>
    <div class="transcript" id="transcript"></div>
  </section>

  <section class="card settings" id="settings">
    <div class="menu" id="menu"></div>
    <button class="row" id="toggle" type="button">
      <span class="badge">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 6h-2.9a15.6 15.6 0 0 0-1.3-3.6A8 8 0 0 1 18.9 8ZM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4ZM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3Zm.8 2h2.9c.3 1.3.8 2.5 1.3 3.6A8 8 0 0 1 5.1 16ZM8 8H5.1a8 8 0 0 1 4.2-3.6C8.8 5.5 8.3 6.7 8 8Zm4 12c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4Zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4Zm.3 5.6c.5-1.1 1-2.3 1.3-3.6h2.9a8 8 0 0 1-4.2 3.6Zm1.7-5.6a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4h-3.4Z"/></svg>
      </span>
      <span class="label">Ngôn ngữ</span>
      <span class="value" id="value">Tiếng Việt</span>
      <svg class="chev" viewBox="0 0 10 10"><path d="M1 3l4 4 4-4"/></svg>
    </button>
  </section>

<script>
(function () {
  var body = document.getElementById("body");
  var stateEl = document.getElementById("state");
  var canvas = document.getElementById("wave");
  var ctx = canvas.getContext("2d");
  var hint = document.getElementById("hint");
  var transcript = document.getElementById("transcript");
  var toggle = document.getElementById("toggle");
  var menu = document.getElementById("menu");
  var valueEl = document.getElementById("value");

  var LANGS = [
    ["vi-VN", "Tiếng Việt"], ["auto", "Tự động nhận diện"], ["en-US", "English"],
    ["zh-CN", "中文"], ["ja-JP", "日本語"], ["ko-KR", "한국어"], ["fr-FR", "Français"],
    ["de-DE", "Deutsch"], ["es-ES", "Español"], ["ru-RU", "Русский"]
  ];
  var TICK = '<svg class="tick" viewBox="0 0 14 14"><path d="M2 7.5l3.2 3L12 3.5" stroke="#007aff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var BARS = 24;
  var levels = new Array(BARS).fill(0);
  var current = 0, lastPush = 0, listening = false, hideTimer = null;
  var selected = "vi-VN";

  function invoke(cmd, args) {
    var core = window.__TAURI__ && window.__TAURI__.core;
    if (core) core.invoke(cmd, args || {});
  }

  // Tạo danh sách; mỗi mục hiện đầy đủ, người dùng cuộn để xem thêm
  LANGS.forEach(function (l) {
    var d = document.createElement("div");
    d.className = "opt";
    d.dataset.code = l[0];
    d.innerHTML = '<span>' + l[1] + '</span>' + TICK;
    d.addEventListener("click", function (e) {
      e.stopPropagation();
      choose(l[0], l[1]);
    });
    menu.appendChild(d);
  });

  function choose(code, name) {
    selected = code;
    valueEl.textContent = name;
    Array.prototype.forEach.call(menu.children, function (c) {
      c.classList.toggle("sel", c.dataset.code === code);
    });
    body.classList.remove("open");
    invoke("set_language", { code: code });
  }
  choose("vi-VN", "Tiếng Việt");

  toggle.addEventListener("click", function (e) {
    e.stopPropagation();
    body.classList.toggle("open");
    if (body.classList.contains("open")) {
      var sel = menu.querySelector(".sel");
      if (sel) sel.scrollIntoView({ block: "nearest" });
    }
  });
  document.addEventListener("click", function () { body.classList.remove("open"); });

  function setListening(on) {
    listening = on;
    body.classList.toggle("on", on);
    stateEl.textContent = on ? "Đang nghe" : "Đã tắt";
    if (!on) current = 0;
  }

  function showText(t) {
    transcript.textContent = t;
    transcript.classList.add("show");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { transcript.classList.remove("show"); }, 6000);
  }

  // Sóng: thanh bo tròn, đối xứng quanh trục giữa, gradient cầu vồng kiểu iOS
  function draw(t) {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (t - lastPush > 60) { levels.push(current); levels.shift(); lastPush = t; }

    var gap = 4, barW = (w - gap * (BARS - 1)) / BARS;
    var grad = ctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, "#5ac8fa");
    grad.addColorStop(0.5, "#007aff");
    grad.addColorStop(1, "#ff2d55");
    ctx.fillStyle = grad;

    for (var i = 0; i < BARS; i++) {
      var breathe = (Math.sin(t / 450 + i * 0.55) + 1) * 0.5 * (listening ? 0.08 : 0.05);
      var amp = Math.max(levels[i], breathe);
      var bh = Math.max(4, amp * h * 0.95);
      var x = i * (barW + gap), y = (h - bh) / 2;
      roundRect(x, y, barW, bh, barW / 2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, h / 2, w / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  var ev = window.__TAURI__ && window.__TAURI__.event;
  if (ev) {
    ev.listen("listening", function (e) { setListening(!!e.payload); });
    ev.listen("level", function (e) { current = Number(e.payload) || 0; });
    ev.listen("text", function (e) { showText(String(e.payload)); });
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
